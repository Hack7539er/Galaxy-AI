<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <g transform="translate(32,33)">
    <!-- orbit ring -->
    <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="url(#ringGrad)" stroke-width="2.2" opacity="0.7" transform="rotate(-20)"/>

    <!-- core orb -->
    <circle cx="0" cy="0" r="15" fill="url(#orbGrad)"/>
    <circle cx="-4.5" cy="-4.5" r="4.5" fill="#ffffff" opacity="0.25"/>

    <!-- small orbiting dot -->
    <circle cx="25" cy="1.5" r="2.6" fill="#FCA5A5" transform="rotate(-20)"/>

    <!-- sparkle -->
    <g transform="translate(13,-14)">
      <path d="M0,-6 L1.8,-1.8 L6,0 L1.8,1.8 L0,6 L-1.8,1.8 L-6,0 L-1.8,-1.8 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="6" fill="url(#starGlow)"/>
    </g>
  </g>
</svg>