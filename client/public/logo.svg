<svg width="520" height="160" viewBox="0 0 520 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Icon group -->
  <g transform="translate(80,80)">
    <!-- orbit rings -->
    <ellipse cx="0" cy="0" rx="62" ry="24" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.55" transform="rotate(-20)"/>
    <ellipse cx="0" cy="0" rx="62" ry="24" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.35" transform="rotate(40)"/>

    <!-- core planet/orb -->
    <circle cx="0" cy="0" r="34" fill="url(#orbGrad)"/>
    <circle cx="-10" cy="-10" r="10" fill="#ffffff" opacity="0.18"/>

    <!-- small orbiting dot -->
    <circle cx="60" cy="4" r="6" fill="#FCA5A5" transform="rotate(-20)"/>

    <!-- sparkle / AI spark -->
    <g transform="translate(30,-32)">
      <path d="M0,-14 L4,-4 L14,0 L4,4 L0,14 L-4,4 L-14,0 L-4,-4 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="14" fill="url(#starGlow)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(150,0)">
    <text x="0" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="700" fill="url(#textGrad)">Galaxy AI</text>
    <text x="2" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="3" fill="#94A3B8">WEBSITE BUILDER</text>
  </g>
</svg>